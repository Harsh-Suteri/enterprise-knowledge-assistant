name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check app eval finetune scripts tests

      - name: Format check
        run: ruff format --check app eval finetune scripts tests

      - name: Unit tests
        run: pytest tests -q

  eval:
    # Retrieval quality is a build artifact, not a vibe. If a change drops
    # hit-rate below the threshold, the build fails.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Retrieval evaluation
        run: python eval/run_eval.py -k 1

      - name: Fail if hit-rate regressed below 90%
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from eval.run_eval import evaluate
          r = evaluate(k=1)
          print(f"hit@1={r['hit_rate']:.0%} MRR={r['mrr']:.3f}")
          if r["hit_rate"] < 0.90:
              print("FAIL: retrieval hit-rate regressed")
              sys.exit(1)
          PY

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t enterprise-knowledge-assistant:ci .
